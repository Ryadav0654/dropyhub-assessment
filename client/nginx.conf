server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for scripts, styles, and SVG icons
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite generates unique content hashes for JS/CSS in /assets (e.g. index-D0xeNVtS.js)
    # Safe to cache aggressively for 1 year because filename changes on every rebuild
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache index.html so users always get the latest bundle hashes on new releases
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA routing: if file doesn't exist on disk, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
